name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  AZURE_FUNCTIONAPP_PACKAGE_PATH: './publish'

# Two deploys racing would migrate the same Neon branch concurrently.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, migrate and deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore FrostWoodTech.sln

      - name: Build
        run: dotnet build FrostWoodTech.sln --configuration Release --no-restore

      # A failing test stops the job before the database is touched.
      - name: Test
        run: dotnet test FrostWoodTech.sln --configuration Release --no-build

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef

      # Migrations run here, never at startup. Use Neon's DIRECT (non-pooled) string for DDL.
      - name: Apply migrations
        env:
          ConnectionStrings__Default: ${{ secrets.NEON_MIGRATION_CONNECTION_STRING }}
        run: dotnet ef database update --project FrostWoodTech.API --no-build --configuration Release

      - name: Publish
        run: >-
          dotnet publish FrostWoodTech.API/FrostWoodTech.API.csproj
          --configuration Release
          --no-build
          --output ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}

      # Health also checks the database, so this catches bad app settings as well as a bad package.
      - name: Smoke test
        if: ${{ vars.AZURE_FUNCTIONAPP_URL != '' }}
        run: |
          url="${{ vars.AZURE_FUNCTIONAPP_URL }}"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "${url%/}/api/health"; then
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 10s"
            sleep 10
          done
          echo "Health check did not pass after deploy." >&2
          exit 1
