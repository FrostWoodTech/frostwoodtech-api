# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy dotnet core project to Azure Function App - func-frostwoodtech-cms-prod

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  AZURE_FUNCTIONAPP_PACKAGE_PATH: './publish'

# Two deploys racing would migrate the same Neon branch concurrently.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore FrostWoodTech.sln

      - name: Build
        run: dotnet build FrostWoodTech.sln --configuration Release --no-restore

      # A failing test stops the job before the database is touched.
      - name: Test
        run: dotnet test FrostWoodTech.sln --configuration Release --no-build

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef

      # Migrations run here, never at startup. Use Neon's DIRECT (non-pooled) string for DDL.
      - name: Apply migrations
        env:
          ConnectionStrings__Default: ${{ secrets.NEON_MIGRATION_CONNECTION_STRING }}
        run: >-
          dotnet ef database update
          --project FrostWoodTech.API --no-build --configuration Release

      # publish, not build: the deployed package must hold the API project alone, without the test assemblies.
      - name: Publish
        run: >-
          dotnet publish FrostWoodTech.API/FrostWoodTech.API.csproj
          --configuration Release
          --no-build
          --output ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_92BF6F2CFD134A4C9D333FD1C69E6710 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D683C956C76D45ED83BCF95EDD98E423 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E36FB923C69E47B28C0396761839B1BA }}

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'func-frostwoodtech-cms-prod'
          slot-name: 'Production'
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}

      # Health also checks the database, so this catches bad app settings as well as a bad package.
      - name: Smoke test
        if: ${{ vars.AZURE_FUNCTIONAPP_URL != '' }}
        run: |
          url="${{ vars.AZURE_FUNCTIONAPP_URL }}"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "${url%/}/api/health"; then
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 10s"
            sleep 10
          done
          echo "Health check did not pass after deploy." >&2
          exit 1
