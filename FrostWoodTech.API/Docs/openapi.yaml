  # ---------------------------------------------------------------------- pricing plans
  /cms/admin/pricing-plans:
    get:
      tags: [admin]
      operationId: getAdminPricingPlans
      summary: List pricing plans, drafts included
      description: "`serviceId`, `comboOnly` and `tiersOnly` are explicit filters; with none, the list is everything. `serviceId` wins over `tiersOnly` if both are sent, and `comboOnly` wins over both. Agency-only, so no `site` param."
      parameters:
        - name: serviceId
          in: query
          description: Only this service's tiers.
          schema: { type: string, format: uuid }
        - name: comboOnly
          in: query
          description: Only plans with no owning service.
          schema: { type: boolean, default: false }
        - name: tiersOnly
          in: query
          description: Only plans belonging to any service — the "Service tiers" kind filter, as opposed to one specific service's tiers.
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/IsPublished"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of plans.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paged"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/AdminPricingPlanResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [admin]
      operationId: createPricingPlan
      summary: Create a pricing plan
      description: "A plan with `serviceId: null` is a combo pack."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePricingPlanRequest" }
      responses:
        "201":
          description: The created plan.
