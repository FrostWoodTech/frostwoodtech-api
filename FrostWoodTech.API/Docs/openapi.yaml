                  - $ref: "#/components/schemas/Paged"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/AdminCertificateResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [admin]
      operationId: createCertificate
      summary: Create a certificate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCertificateRequest" }
      responses:
        "201":
          description: The created certificate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCertificateResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /cms/admin/certificates/{id}:
    get:
      tags: [admin]
      operationId: getAdminCertificateById
      summary: One certificate, drafts included
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { $ref: "#/components/responses/AdminCertificate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [admin]
      operationId: updateCertificate
      summary: Replace a certificate
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCertificateRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminCertificate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [admin]
      operationId: deleteCertificate
      summary: Soft-delete a certificate
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /cms/admin/certificates/reorder:
    post:
      tags: [admin]
      operationId: reorderCertificates
      summary: Bulk sort order — certificates share one global order
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CertificateReorderRequest" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ------------------------------------------------------------------------------- reviews
  /cms/admin/reviews:
    get:
      tags: [admin]
      operationId: getAdminReviews
      summary: List reviews, drafts included
      parameters:
        - $ref: "#/components/parameters/IsPublished"
        - name: isFeatured
          in: query
          schema: { type: boolean }
        - name: country
          in: query
          description: Matches either the display name or the ISO code.
          schema: { type: string }
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of reviews.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paged"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/AdminReviewResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [admin]
      operationId: createReview
      summary: Add a review manually
      description: For a testimonial collected elsewhere — not what the public submission endpoint uses.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReviewRequest" }
      responses:
        "201":
          description: The created review.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminReviewResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /cms/admin/reviews/{id}:
    get:
      tags: [admin]
      operationId: getAdminReviewById
      summary: One review, drafts included
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { $ref: "#/components/responses/AdminReview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [admin]
      operationId: updateReview
      summary: Replace a review
      description: Also how publish/unpublish, featured, and manual reorder each happen.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReviewRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminReview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [admin]
      operationId: deleteReview
      summary: Soft-delete a review
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /cms/admin/reviews/reorder:
    post:
      tags: [admin]
      operationId: reorderReviews
      summary: Bulk sort order
      description: Reviews have one shared order, not a per-site one — no `site` on the body.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChildReorderRequest" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ------------------------------------------------------------------------------- contact submissions
  /cms/admin/contact-submissions:
    get:
      tags: [admin]
      operationId: getAdminContactSubmissions
      summary: List contact form enquiries
      parameters:
        - $ref: "#/components/parameters/ContactStatusFilter"
        - name: site
          in: query
          description: Which frontend the enquiry came from. Optional — omit to get both.
          schema: { $ref: "#/components/schemas/Site" }
        - name: serviceId
          in: query
          description: Only enquiries about this service.
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of contact submissions, newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paged"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/AdminContactSubmissionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /cms/admin/contact-submissions/{id}:
    get:
      tags: [admin]
      operationId: getAdminContactSubmissionById
      summary: One contact submission
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { $ref: "#/components/responses/AdminContactSubmission" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [admin]
      operationId: updateContactSubmission
      summary: Triage a submission
      description: Status and internal notes only — an admin can never rewrite what the visitor submitted. Moving `status` to `replied` stamps `repliedAt`/`repliedBy` from the caller's own token.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateContactSubmissionRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminContactSubmission" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [admin]
      operationId: deleteContactSubmission
      summary: Soft-delete a contact submission
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ------------------------------------------------------------------------------- tags
  /cms/admin/tags:
    get:
      tags: [admin]
      operationId: getAdminTags
      summary: List tags
      parameters:
        - $ref: "#/components/parameters/IsTechnology"
        - $ref: "#/components/parameters/TechnologyCategory"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of tags.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paged"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/AdminTagResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [admin]
      operationId: createTag
      summary: Create a tag
      description: A technology tag requires `technologyCategory`; a category tag must have none.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTagRequest" }
      responses:
        "201":
          description: The created tag.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTagResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /cms/admin/tags/{id}:
    get:
      tags: [admin]
      operationId: getAdminTagById
      summary: One tag
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { $ref: "#/components/responses/AdminTag" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [admin]
      operationId: updateTag
      summary: Replace a tag
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTagRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminTag" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [admin]
      operationId: deleteTag
      summary: Soft-delete a tag
      description: Refused with `tag_in_use` while any project or article still carries the tag.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /cms/admin/tags/categories:
    get:
      tags: [admin]
      operationId: getTechCategories
      summary: List technology categories
      description: The fixed `TechCategory` enum, value plus display label — lets the admin SPA build its category picker without hardcoding the enum.
      responses:
        "200":
          description: Every `TechCategory` value, in declaration order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TechCategoryOption" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ------------------------------------------------------------------------- currencies
  /cms/admin/currencies:
    get:
      tags: [admin]
      operationId: getAdminCurrencies
      summary: List currencies, inactive included
      parameters:
        - name: isActive
          in: query
          description: Admin-only filter. Omit to get active and inactive alike.
          schema: { type: boolean }
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of currencies, ordered by code.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paged"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/AdminCurrencyResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [admin]
      operationId: createCurrency
      summary: Add a currency
      description: "`manualRateFromUsd` (\"price set by me\") is units per 1 USD and, when present, must be greater than zero. Omit it to fall back to the live rate from the last refresh — a currency with neither is hidden from the public list until one exists. USD itself must always carry exactly 1 and stay active — it is the base every rate is expressed against and the fallback every visitor sees."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCurrencyRequest" }
      responses:
        "201":
          description: The created currency.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCurrencyResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /cms/admin/currencies/{id}:
    get:
      tags: [admin]
      operationId: getAdminCurrencyById
      summary: One currency
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { $ref: "#/components/responses/AdminCurrency" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [admin]
      operationId: updateCurrency
      summary: Replace a currency
      description: A full replacement — setting or clearing the manual override goes through this. The live rate only ever changes via a refresh, not this endpoint. Renaming USD is refused with `cannot_rename_base_currency`.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCurrencyRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminCurrency" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [admin]
      operationId: deleteCurrency
      summary: Soft-delete a currency
      description: Refused with `cannot_delete_base_currency` for USD, and with `currency_in_use` while any pricing plan still prices in it.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /cms/admin/currencies/refresh-rates:
    post:
      tags: [admin]
      operationId: refreshCurrencyRates
      summary: Refresh every currency's live rate
      description: One call to a free external FX provider updates every currency's `liveRateFromUsd`/`liveRateFetchedAt` at once. A code the provider doesn't recognise is left untouched. There is no scheduled refresh yet — this is the only way a live rate changes.
      responses:
        "200":
          description: How many currencies were updated, and when.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefreshCurrencyRatesResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ------------------------------------------------------------------------------ media
  /cms/admin/media/presigned-upload:
    post:
      tags: [admin]
      operationId: createPresignedUpload
      summary: Presign a direct-to-Neon-Object-Storage upload
      description: Image bytes never reach this API — the browser PUTs straight to Neon Object Storage with the returned URL, then the entity's image endpoint is called with `objectKey`, dimensions and alt text.

        The client sends a `target` rather than a folder path, so a stolen admin token cannot
        write anywhere else in the bucket. `slug` is required when the target is `projects` or
        `articles`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PresignedUploadRequest" }
      responses:
        "200":
          description: A presigned PUT URL, valid for a short window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresignedUploadResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /cms/admin/media/config:
    get:
      tags: [admin]
      operationId: getMediaConfig
      summary: The base URL a `media://` token resolves against
      description: Lets the admin SPA turn a round-tripped `media://` token back into a loadable url itself, without a per-image resolve request. Not sensitive — the bucket is already publicly readable.
      responses:
        "200":
          description: The delivery URL prefix.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaConfigResponse" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "The `accessToken` from login/google/refresh, sent as `Authorization: Bearer <token>`. Required on all `/cms/admin/*` routes except register, login, google, refresh and logout."

  headers:
    ETag:
      description: Version of this payload. Send it back as `If-None-Match` to get a `304`.
      schema: { type: string }
    PublicCacheControl:
      description: Always `public, max-age=300` on public GETs.
      schema: { type: string }

  parameters:
    SiteRequired:
      name: site
      in: query
      required: true
      description: "Which frontend is asking. Required — missing it is `400 site_required`, never \"return everything\"."
      schema: { $ref: "#/components/schemas/Site" }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      description: Capped at 100.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Search:
      name: search
      in: query
      schema: { type: string }
    Featured:
      name: featured
      in: query
      description: Only rows featured on the requested site's home page.
      schema: { type: boolean }
    IsPublished:
      name: isPublished
      in: query
      description: Admin-only filter. Omit to get drafts and published rows alike.
      schema: { type: boolean }
    IncludeHidden:
      name: includeHidden
      in: query
      description: >-
        Skips the show-on-`site` filter `site` would otherwise apply. Used by the
        reorder/visibility screen, which needs every row in both columns —
        including ones not yet shown on that site — since it's the screen that
        turns showing on in the first place.
      schema: { type: boolean, default: false }
    ServiceIdFilter:
      name: serviceId
      in: query
      description: "Only FAQs scoped to this service. Mutually exclusive in effect with `globalOnly` — this one wins if both are sent."
      schema: { type: string, format: uuid }
    GlobalOnly:
      name: globalOnly
      in: query
      description: "Only FAQs with no service — the shared list both public sites render. Ignored when `serviceId` is also sent."
      schema: { type: boolean, default: false }
    ReviewSort:
      name: sort
      in: query
      schema: { type: string, enum: [latest, rating, country], default: latest }
    ContactStatusFilter:
      name: status
      in: query
      description: Admin-only filter. Omit to get every status.
      schema: { $ref: "#/components/schemas/ContactSubmissionStatus" }
    IsTechnology:
      name: isTechnology
      in: query
      description: "`true` for technology tags, `false` for category tags."
      schema: { type: boolean }
    TechnologyCategory:
      name: category
      in: query
      description: Only meaningful for technology tags.
      schema: { $ref: "#/components/schemas/TechCategory" }
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    FeatureIdPath:
      name: featureId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ImageIdPath:
      name: imageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SlugPath:
      name: slug
      in: path
      required: true
      description: Stable once published — changing a live slug breaks links.
      schema: { type: string }

  responses:
    NoContent:
      description: Done. No body.
    NotModified:
      description: Your `If-None-Match` matched. No body.
    BadRequest:
      description: Validation failed. See `code`.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    SiteRequired:
      description: "`?site=` was missing (`site_required`) or invalid (`validation_failed`)."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Missing, expired or invalid bearer token.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Authenticated, but the role is not allowed here — super admin only.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: No such row, or it is soft-deleted.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: "The change collides with existing data — `slug_taken`, `tag_in_use`, `email_taken`."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

    Auth:
      description: >-
        An access token and the signed-in account. The rotating refresh token rides along as an
        httpOnly `Set-Cookie`, not in this body.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AuthResponse" }
    AdminUser:
      description: The account.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminUserResponse" }
    AdminProject:
      description: The project, drafts and metadata included.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminProjectResponse" }
    AdminArticle:
      description: The article, drafts and metadata included.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminArticleResponse" }
    AdminService:
      description: The service, drafts and metadata included.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminServiceResponse" }
    AdminPricingPlan:
      description: The pricing plan, drafts and metadata included.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminPricingPlanResponse" }
    AdminFaq:
      description: The FAQ, drafts and metadata included.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminFaqResponse" }
    AdminCertificate:
      description: The certificate, drafts and metadata included.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminCertificateResponse" }
    AdminReview:
      description: The review, drafts and metadata included.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminReviewResponse" }
    AdminContactSubmission:
      description: The contact submission, triage state and submitter IP included.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminContactSubmissionResponse" }
    AdminTag:
      description: The tag.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminTagResponse" }
    AdminCurrency:
      description: The currency, inactive rows included.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminCurrencyResponse" }

    PublicProjectList:
      description: A page of published projects.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
        Cache-Control: { $ref: "#/components/headers/PublicCacheControl" }
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Paged"
              - type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ProjectResponse" }
    PublicArticleList:
      description: A page of published articles.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
        Cache-Control: { $ref: "#/components/headers/PublicCacheControl" }
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Paged"
              - type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ArticleResponse" }
    PublicServiceList:
      description: A page of published services.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
        Cache-Control: { $ref: "#/components/headers/PublicCacheControl" }
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Paged"
              - type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ServiceResponse" }
    PublicPricingPlanList:
      description: A page of published pricing plans.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
        Cache-Control: { $ref: "#/components/headers/PublicCacheControl" }
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Paged"
              - type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PricingPlanResponse" }
    PublicCertificateList:
      description: A page of published certificates.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
        Cache-Control: { $ref: "#/components/headers/PublicCacheControl" }
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Paged"
              - type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CertificateResponse" }

  schemas:
    # ---------------------------------------------------------------------------- enums
    Site:
      type: string
      enum: [agency, personal]
      description: The two public frontends.
    ContactSubmissionStatus:
      type: string
      enum: [new, read, replied, archived, spam]
      description: "`spam` is set by the server (honeypot) — never chosen by the submitter."
    ContactBudgetRange:
      type: string
      enum: [under_one_k, one_to_five_k, five_to_fifteen_k, over_fifteen_k, not_sure]
      description: Optional, coarse budget band on the contact form. Qualifies a lead, not a quote.
    TechCategory:
      type: string
      enum:
        - frontend
        - backend
        - language
        - database
        - tool_or_platform
        - cloud_devops
        - ai_ml_dl
        - agentic_ai
        - design
        - other

    TechCategoryOption:
      type: object
      properties:
        value: { $ref: "#/components/schemas/TechCategory" }
        label: { type: string }
      required: [value, label]

    PriceType:
      type: string
      enum: [fixed, starting_from, hourly, monthly, custom]
    UserRole:
      type: string
      enum: [super_admin, admin]
    UserStatus:
      type: string
      enum: [email_verification_required, pending, approved, rejected, disabled]
    MediaTarget:
      type: string
      enum: [projects, services, tags, articles, certificates]

    # -------------------------------------------------------------------------- envelope
    Problem:
      type: object
      description: "RFC 7807. Switch on `code` (stable) — `detail` is human-readable and may change."
      properties:
        type: { type: string }
        title: { type: string, examples: ["Bad Request"] }
        status: { type: integer, examples: [400] }
        detail: { type: string }
        code:
          type: string
          description: "Stable machine-readable code, e.g. `site_required`, `validation_failed`, `slug_taken`, `tag_in_use`."
          examples: [site_required]
      required: [status, title, code]

    Paged:
      type: object
      description: The envelope every list endpoint returns.
      properties:
        page: { type: integer, examples: [1] }
        pageSize: { type: integer, examples: [20] }
        total:
          type: integer
          description: Total matching rows, not the size of this page.
      required: [items, page, pageSize, total]

    # ---------------------------------------------------------------------- public reads
    TagResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        isTechnology: { type: boolean }
        technologyCategory:
          oneOf:
            - $ref: "#/components/schemas/TechCategory"
            - type: "null"
      required: [id, name, slug, isTechnology]

    CurrencyResponse:
      type: object
      description: One selectable display currency. `isActive` never crosses this boundary — the public list only ever contains active, priced rows.
      properties:
        code:
          type: string
          description: ISO 4217, upper-cased.
          examples: ["LKR"]
        name: { type: string, examples: ["Sri Lankan Rupee"] }
        symbol: { type: string, examples: ["Rs"] }
        rateFromUsd:
          type: number
          description: The effective rate — the admin's manual override when one is set, otherwise the last-fetched live rate. USD itself is always exactly 1.
          examples: [325]
      required: [code, name, symbol, rateFromUsd]

    ProjectImageResponse:
      type: object
      description: "The API stores the Neon Object Storage `objectKey` plus dimensions and alt text — never image bytes."
      properties:
        id: { type: string, format: uuid }
        objectKey: { type: string, examples: ["frostwoodtech/projects/acme-site/hero"] }
        url: { type: string, format: uri }
        altText: { type: string }
        width: { type: integer }
        height: { type: integer }
        isPrimary:
          type: boolean
          description: Exactly one image per project is primary.
        sortOrder: { type: integer }
      required: [id, objectKey, url, altText, width, height, isPrimary, sortOrder]

    ProjectResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        year: { type: integer }
        shortDescription: { type: string }
        description:
          type: string
          description: Raw markdown. Sanitize on render, not on write.
        websiteUrl: { type: [string, "null"], format: uri }
        problem: { type: [string, "null"] }
        solution: { type: [string, "null"] }
        whatWeDelivered: { type: [string, "null"] }
        proof: { type: [string, "null"] }
        clientName: { type: [string, "null"] }
        publishedAt: { type: [string, "null"], format: date-time }
        seoTitle: { type: [string, "null"] }
        seoDescription: { type: [string, "null"] }
        featured:
          type: boolean
          description: Featured on the requested site's home page.
        sortOrder:
          type: integer
          description: The requested site's sort order, already resolved.
        tags:
          type: array
          items: { $ref: "#/components/schemas/TagResponse" }
        images:
          type: array
          items: { $ref: "#/components/schemas/ProjectImageResponse" }
      required: [id, slug, title, year, shortDescription, description, featured, sortOrder, tags, images]

    ArticleResponse:
      type: object
      description: >
        An article renders from its own contentMarkdown. contentMarkdown has every media://
        reference already resolved to a real URL.
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        excerpt: { type: string }
        slug: { type: [string, "null"] }
        publishedAt:
          type: [string, "null"]
          format: date-time
          description: When the article first went live. Null only for a row published before this field existed.
        updatedAt: { type: string, format: date-time }
        coverImageKey:
          type: [string, "null"]
          description: Neon Object Storage object key.
        contentMarkdown:
          type: [string, "null"]
          description: >
            Markdown body with every media://articles/... reference resolved to a real Neon
            Object Storage URL. Ready to hand straight to a Markdown renderer.
        featured: { type: boolean }
        sortOrder: { type: integer }
        tags:
          type: array
          items: { $ref: "#/components/schemas/TagResponse" }
      required: [id, title, excerpt, updatedAt, featured, sortOrder, tags]

    ServiceProjectResponse:
      type: object
      description: A case-study card on a service page. Card fields only — the full project is a round trip to `/public/projects/{slug}` away.
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        shortDescription: { type: string }
        year: { type: integer }
        imageUrl: { type: [string, "null"] }
        imageAltText: { type: [string, "null"] }
      required: [id, slug, title, shortDescription, year]

    ServiceResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        shortDescription:
          type: string
          description: Markdown — the card blurb, and the fallback body when the page fields are empty.
        eyebrow:
          type: [string, "null"]
          description: Small badge above the page headline, e.g. "Arizona · Website pages".
        headline:
          type: [string, "null"]
          description: The page's H1. Null means fall back to `name`.
        deck: { type: [string, "null"] }
        whoThisIsFor: { type: [string, "null"], description: Markdown bullet list. }
        outcomes: { type: [string, "null"], description: Markdown bullet list. }
        capabilities: { type: [string, "null"], description: Markdown bullet list. }
        inDepth: { type: [string, "null"], description: Markdown. }
        primaryCtaLabel: { type: [string, "null"] }
        primaryCtaUrl: { type: [string, "null"] }
        secondaryCtaLabel: { type: [string, "null"] }
        secondaryCtaUrl: { type: [string, "null"] }
        iconUrl: { type: [string, "null"] }
        iconWidth: { type: [integer, "null"] }
        iconHeight: { type: [integer, "null"] }
        iconAltText: { type: [string, "null"] }
        heroImageUrl: { type: [string, "null"] }
        heroImageWidth: { type: [integer, "null"] }
        heroImageHeight: { type: [integer, "null"] }
        heroImageAltText: { type: [string, "null"] }
        depthImageUrl: { type: [string, "null"] }
        depthImageWidth: { type: [integer, "null"] }
        depthImageHeight: { type: [integer, "null"] }
        depthImageAltText: { type: [string, "null"] }
        seoTitle: { type: [string, "null"] }
        seoDescription: { type: [string, "null"] }
        projects:
          type: [array, "null"]
          description: Case studies for this service. Null on the list endpoint — only `GET /public/services/{slug}` populates it.
          items: { $ref: "#/components/schemas/ServiceProjectResponse" }
        faqs:
          type: [array, "null"]
          description: This service's own FAQs, in sort order. Null on the list endpoint, as above.
          items: { $ref: "#/components/schemas/FaqResponse" }
        publishedAt: { type: [string, "null"], format: date-time }
        featured: { type: boolean }
        sortOrder: { type: integer }
      required: [id, slug, name, shortDescription, featured, sortOrder]

    PricingPlanFeatureResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        isIncluded:
          type: boolean
          description: "`false` renders as a struck-through line — what this tier does not include."
        sortOrder: { type: integer }
      required: [id, text, isIncluded, sortOrder]

    PricingPlanResponse:
      type: object
      description: Agency-only.
      properties:
        id: { type: string, format: uuid }
        serviceId:
          type: [string, "null"]
          format: uuid
          description: Null means this is a combo pack rather than one service's tier.
        name: { type: string }
        tagline: { type: [string, "null"] }
        priceAmount:
          type: [number, "null"]
          description: Null is valid and means "Custom / Contact us" — it is not zero.
        currency: { type: string, examples: [USD] }
        priceType: { $ref: "#/components/schemas/PriceType" }
        deliveryText: { type: [string, "null"] }
        description: { type: string }
        isPopular: { type: boolean }
        ctaLabel: { type: [string, "null"] }
        ctaUrl: { type: [string, "null"], format: uri }
        featured: { type: boolean }
        sortOrder:
          type: integer
          description: Drag-and-drop order — never a typed number on create/update.
        features:
          type: array
          items: { $ref: "#/components/schemas/PricingPlanFeatureResponse" }
      required: [id, name, currency, priceType, description, isPopular, featured, sortOrder, features]

    FaqResponse:
      type: object
      description: FAQs have no "featured" concept and share one sort order across both sites.
      properties:
        id: { type: string, format: uuid }
        question: { type: string }
        answer: { type: string }
        sortOrder: { type: integer }
      required: [id, question, answer, sortOrder]

    CertificateResponse:
      type: object
      description: Personal-site only — there is no `site` concept here, certificates never exist for the agency site.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        issuedBy: { type: string }
        issuedDate: { type: string, format: date }
        marks: { type: [string, "null"], description: "Free text — a score, grade, or \"Distinction\" style result." }
        url: { type: string }
        mimeType: { type: string, description: "e.g. application/pdf, image/png." }
        width: { type: [integer, "null"], description: Null when the file is a PDF. }
        height: { type: [integer, "null"] }
        altText: { type: string }
        featured: { type: boolean }
        sortOrder: { type: integer }
      required: [id, name, issuedBy, issuedDate, url, mimeType, altText, featured, sortOrder]

    ReviewResponse:
      type: object
      description: The draft state, featured flag, sort order, and submitter IP never cross this boundary.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        country: { type: string }
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2 — the frontend derives the flag emoji from this.
          examples: ["US"]
        position: { type: [string, "null"] }
        rating: { type: integer, minimum: 1, maximum: 5 }
        reviewText: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, name, country, countryCode, rating, reviewText, createdAt]

    HomeResponse:
      type: object
      description: The featured slices for one site, plus its FAQs and reviews.
      properties:
        featuredProjects:
          type: array
          items: { $ref: "#/components/schemas/ProjectResponse" }
        featuredArticles:
          type: array
          items: { $ref: "#/components/schemas/ArticleResponse" }
        featuredServices:
          type: array
          items: { $ref: "#/components/schemas/ServiceResponse" }
        featuredPricingPlans:
          type: array
          items: { $ref: "#/components/schemas/PricingPlanResponse" }
        faqs:
          type: array
          items: { $ref: "#/components/schemas/FaqResponse" }
        featuredReviews:
          type: array
          description: Not site-scoped — reviews are shared across both public sites.
          items: { $ref: "#/components/schemas/ReviewResponse" }
      required:
        [featuredProjects, featuredArticles, featuredServices, featuredPricingPlans, faqs, featuredReviews]

    # ------------------------------------------------------------------- shared fragments
    SiteVisibility:
      type: object
      description: "Per-site visibility — why there's one row per entity, not one per site. `featuredOn*` requires the matching `showOn*`."
      properties:
        showOnAgency: { type: boolean, default: false }
        featuredOnAgency: { type: boolean, default: false }
        agencySortOrder: { type: integer, default: 0 }
        showOnPersonal: { type: boolean, default: false }
        featuredOnPersonal: { type: boolean, default: false }
        personalSortOrder: { type: integer, default: 0 }

    Timestamps:
      type: object
      properties:
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [createdAt, updatedAt]

    # ---------------------------------------------------------------------- admin reads
    AdminUserResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        status: { $ref: "#/components/schemas/UserStatus" }
        lastLoginAt: { type: [string, "null"], format: date-time }
        approvedAt: { type: [string, "null"], format: date-time }
        rejectionReason: { type: [string, "null"] }
        emailVerifiedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
      required: [id, email, firstName, lastName, role, status, createdAt]

    AdminTagResponse:
      allOf:
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            slug: { type: string }
            isTechnology: { type: boolean }
            technologyCategory:
              oneOf:
                - $ref: "#/components/schemas/TechCategory"
                - type: "null"
          required: [id, name, slug, isTechnology]

    AdminCurrencyResponse:
      allOf:
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          description: Exposes the override and the live rate separately, plus which one is actually in effect, so the admin can see why a currency shows what it shows.
          properties:
            id: { type: string, format: uuid }
            code: { type: string, examples: ["LKR"] }
            name: { type: string, examples: ["Sri Lankan Rupee"] }
            symbol: { type: string, examples: ["Rs"] }
            manualRateFromUsd:
              oneOf: [{ type: number }, { type: "null" }]
              description: "\"Price set by me.\" Null means the live rate is used instead."
              examples: [325]
            liveRateFromUsd:
              oneOf: [{ type: number }, { type: "null" }]
              description: "\"Actual price,\" as of the last refresh. Null until one has run."
            liveRateFetchedAt:
              oneOf: [{ type: string, format: date-time }, { type: "null" }]
            effectiveRateFromUsd:
              oneOf: [{ type: number }, { type: "null" }]
              description: What a visitor actually converts at. Null means neither number exists yet.
            isActive: { type: boolean }
          required: [id, code, name, symbol, isActive]

    AdminProjectResponse:
      allOf:
        - $ref: "#/components/schemas/SiteVisibility"
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          properties:
            id: { type: string, format: uuid }
            slug: { type: string }
            title: { type: string }
            year: { type: integer }
            shortDescription: { type: string }
            description: { type: string }
            websiteUrl: { type: [string, "null"], format: uri }
            problem: { type: [string, "null"] }
            solution: { type: [string, "null"] }
            whatWeDelivered: { type: [string, "null"] }
            proof: { type: [string, "null"] }
            clientName: { type: [string, "null"] }
            isPublished: { type: boolean }
            publishedAt: { type: [string, "null"], format: date-time }
            seoTitle: { type: [string, "null"] }
            seoDescription: { type: [string, "null"] }
            tags:
              type: array
              items: { $ref: "#/components/schemas/AdminTagResponse" }
            images:
              type: array
              items: { $ref: "#/components/schemas/ProjectImageResponse" }
          required: [id, slug, title, year, shortDescription, description, isPublished, tags, images]

    AdminArticleResponse:
      allOf:
        - $ref: "#/components/schemas/SiteVisibility"
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
            excerpt: { type: string }
            slug: { type: [string, "null"] }
            publishedAt:
              type: [string, "null"]
              format: date-time
              description: Null until the article is first published.
            coverImageKey: { type: [string, "null"] }
            contentMarkdown:
              type: [string, "null"]
              description: Raw Markdown, media:// tokens unresolved — this is what the editor edits.
            isPublished: { type: boolean }
            tags:
              type: array
              items: { $ref: "#/components/schemas/AdminTagResponse" }
          required: [id, title, excerpt, isPublished, tags]

    ServiceProjectSummary:
      type: object
      description: A linked project as the admin service form needs it — enough for a chip and a published/draft badge, not the whole case study.
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        year: { type: integer }
        isPublished: { type: boolean }
      required: [id, slug, title, year, isPublished]

    AdminServiceResponse:
      allOf:
        - $ref: "#/components/schemas/SiteVisibility"
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          properties:
            id: { type: string, format: uuid }
            slug: { type: string }
            name: { type: string }
            shortDescription: { type: string }
            eyebrow: { type: [string, "null"] }
            headline: { type: [string, "null"] }
            deck: { type: [string, "null"] }
            whoThisIsFor: { type: [string, "null"] }
            outcomes: { type: [string, "null"] }
            capabilities: { type: [string, "null"] }
            inDepth: { type: [string, "null"] }
            primaryCtaLabel: { type: [string, "null"] }
            primaryCtaUrl: { type: [string, "null"] }
            secondaryCtaLabel: { type: [string, "null"] }
            secondaryCtaUrl: { type: [string, "null"] }
            iconObjectKey: { type: [string, "null"] }
            iconUrl: { type: [string, "null"] }
            iconWidth: { type: [integer, "null"] }
            iconHeight: { type: [integer, "null"] }
            iconAltText: { type: [string, "null"] }
            heroImageObjectKey: { type: [string, "null"] }
            heroImageUrl: { type: [string, "null"] }
            heroImageWidth: { type: [integer, "null"] }
            heroImageHeight: { type: [integer, "null"] }
            heroImageAltText: { type: [string, "null"] }
            depthImageObjectKey: { type: [string, "null"] }
            depthImageUrl: { type: [string, "null"] }
            depthImageWidth: { type: [integer, "null"] }
            depthImageHeight: { type: [integer, "null"] }
            depthImageAltText: { type: [string, "null"] }
            projects:
              type: array
              items: { $ref: "#/components/schemas/ServiceProjectSummary" }
            seoTitle: { type: [string, "null"] }
            seoDescription: { type: [string, "null"] }
            isPublished: { type: boolean }
            publishedAt: { type: [string, "null"], format: date-time }
          required: [id, slug, name, shortDescription, projects, isPublished]

    AdminPricingPlanResponse:
      allOf:
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          description: Agency-only — no per-site visibility block, unlike projects/articles/services.
          properties:
            id: { type: string, format: uuid }
            serviceId: { type: [string, "null"], format: uuid }
            name: { type: string }
            tagline: { type: [string, "null"] }
            priceAmount: { type: [number, "null"] }
            currency: { type: string }
            priceType: { $ref: "#/components/schemas/PriceType" }
            deliveryText: { type: [string, "null"] }
            description: { type: string }
            isPopular: { type: boolean }
            ctaLabel: { type: [string, "null"] }
            ctaUrl: { type: [string, "null"], format: uri }
            isPublished: { type: boolean }
            featured: { type: boolean }
            sortOrder:
              type: integer
              description: Drag-and-drop order — never a typed number on create/update.
            features:
              type: array
              items: { $ref: "#/components/schemas/PricingPlanFeatureResponse" }
          required: [id, name, currency, priceType, description, isPopular, isPublished, featured, sortOrder, features]

    AdminFaqResponse:
      allOf:
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          description: FAQs keep their own visibility flags — no featured flag or per-site sort order, unlike the other site-visible entities.
          properties:
            id: { type: string, format: uuid }
            serviceId:
              type: [string, "null"]
              format: uuid
              description: Null means this is a general FAQ shared by both sites.
            serviceName:
              type: [string, "null"]
              description: For display next to the scope filter. Null exactly when serviceId is null.
            question: { type: string }
            answer: { type: string }
            sortOrder:
              type: integer
              description: Ordered within its scope (global, or one service) — not across every FAQ.
            isPublished: { type: boolean }
            showOnAgency: { type: boolean }
            showOnPersonal: { type: boolean }
          required: [id, question, answer, sortOrder, isPublished, showOnAgency, showOnPersonal]

    AdminCertificateResponse:
      allOf:
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          description: Personal-site only — no site-visibility block at all, unlike projects/articles/services.
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            issuedBy: { type: string }
            issuedDate: { type: string, format: date }
            marks: { type: [string, "null"] }
            objectKey: { type: string }
            url: { type: string }
            mimeType: { type: string }
            width: { type: [integer, "null"] }
            height: { type: [integer, "null"] }
            altText: { type: string }
            isPublished: { type: boolean }
            featured: { type: boolean }
            sortOrder:
              type: integer
              description: Drag-and-drop order — never a typed number on create/update.
          required: [id, name, issuedBy, issuedDate, objectKey, url, mimeType, altText, isPublished, featured, sortOrder]

    AdminReviewResponse:
      type: object
      description: Draft state, featured flag, sort order, and the submitter's IP for spam moderation.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        country: { type: string }
        countryCode: { type: string, examples: ["US"] }
        position: { type: [string, "null"] }
        rating: { type: integer, minimum: 1, maximum: 5 }
        reviewText: { type: string }
        isPublished: { type: boolean }
        isFeatured: { type: boolean }
        sortOrder: { type: integer }
        submitterIp: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required:
        [id, name, country, countryCode, rating, reviewText, isPublished, isFeatured, sortOrder, createdAt, updatedAt]

    AdminContactSubmissionResponse:
      type: object
      description: Everything the visitor sent, plus triage state and the submitter's IP for spam moderation. Never reused on the public surface.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: [string, "null"] }
        company: { type: [string, "null"] }
        subject: { type: [string, "null"] }
        message: { type: string }
        serviceId: { type: [string, "null"], format: uuid }
        serviceName: { type: [string, "null"] }
        budgetRange:
          oneOf:
            - $ref: "#/components/schemas/ContactBudgetRange"
            - type: "null"
        site: { $ref: "#/components/schemas/Site" }
        status: { $ref: "#/components/schemas/ContactSubmissionStatus" }
        adminNotes: { type: [string, "null"] }
        repliedAt: { type: [string, "null"], format: date-time }
        repliedBy: { type: [string, "null"], format: uuid }
        submitterIp: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, name, email, message, site, status, createdAt, updatedAt]

    # ------------------------------------------------------------------- auth contracts
    RegisterRequest:
      type: object
      properties:
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        password:
          type: string
          format: password
          minLength: 8
        confirmPassword: { type: string, format: password }
      required: [firstName, lastName, email, password, confirmPassword]

    VerifyEmailRequest:
      type: object
      properties:
        token: { type: string }
      required: [token]

    ForgotPasswordRequest:
      type: object
      properties:
        email: { type: string, format: email }
      required: [email]

    ForgotPasswordResponse:
      type: object
      properties:
        message: { type: string }

    SetPasswordRequest:
      type: object
      properties:
        token: { type: string }
        password: { type: string, minLength: 8 }
        confirmPassword: { type: string }
      required: [token, password, confirmPassword]

    ResendVerificationRequest:
      type: object
      properties:
        email: { type: string, format: email }
      required: [email]

    ResendVerificationResponse:
      type: object
      properties:
        message: { type: string }
      required: [message]

    LoginRequest:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
      required: [email, password]

    GoogleSignInRequest:
      type: object
      properties:
        idToken:
          type: string
          description: The ID token from Google Sign-In, verified against Google's keys server-side.
      required: [idToken]

    ChangePasswordRequest:
      type: object
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password, minLength: 8 }
        confirmNewPassword: { type: string, format: password }
      required: [currentPassword, newPassword, confirmNewPassword]

    RejectUserRequest:
      type: object
      properties:
        reason: { type: string }
      required: [reason]

    AuthResponse:
      type: object
      description: >-
        The refresh token never appears here — it's set as an httpOnly `refreshToken` cookie,
        single-use, rotated (and revoking the one you sent) on every `/auth/refresh` call.
      properties:
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/AdminUserResponse" }
      required: [accessToken, expiresAt, user]

    # ---------------------------------------------------------------- admin write bodies
    SetPublishedRequest:
      type: object
      properties:
        isPublished: { type: boolean }
      required: [isPublished]

    ReorderRequest:
      type: object
      description: Bulk `sort_order` update for one site, applied in a single save.
      properties:
        site: { $ref: "#/components/schemas/Site" }
        items:
          type: array
          items: { $ref: "#/components/schemas/ReorderItem" }
      required: [site, items]

    ChildReorderRequest:
      type: object
      description: "Reordering a parent's children — images or features. No `site`: children aren't site-scoped."
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ReorderItem" }
      required: [items]

    FaqReorderRequest:
      type: object
      description: "Bulk `sort_order` update for FAQs. No `site`: FAQs share one order across both sites."
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ReorderItem" }
      required: [items]

    CertificateReorderRequest:
      type: object
      description: "Bulk `sort_order` update for certificates. No `site`: certificates only ever exist for the personal site."
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ReorderItem" }
      required: [items]

    PricingReorderRequest:
      type: object
      description: "Bulk `sort_order` update for pricing plans. No `site`: pricing is agency-only."
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ReorderItem" }
      required: [items]

    ReorderItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        sortOrder: { type: integer }
      required: [id, sortOrder]

    CreateProjectRequest:
      type: object
      description: >
        Also used for `PUT` (full replacement). Omit `slug` to generate one from the title — a
        published project's slug should stay put. Unlike SiteVisibility elsewhere, sort order is
        not writable here — a new project is appended to the end of both sites' order, and it only
        ever changes via POST /cms/admin/projects/reorder.
      properties:
        title: { type: string }
        slug: { type: string }
        year: { type: integer }
        shortDescription: { type: string }
        description: { type: string, description: Raw markdown. }
        websiteUrl: { type: string, format: uri }
        problem: { type: string }
        solution: { type: string }
        whatWeDelivered: { type: string }
        proof: { type: string }
        clientName: { type: string }
        isPublished: { type: boolean, default: false }
        seoTitle: { type: string }
        seoDescription: { type: string }
        showOnAgency: { type: boolean, default: false }
        featuredOnAgency: { type: boolean, default: false }
        showOnPersonal: { type: boolean, default: false }
        featuredOnPersonal: { type: boolean, default: false }
        tagIds:
          type: array
          items: { type: string, format: uuid }
      required: [title, year, shortDescription, description]

    CreateArticleRequest:
      type: object
      description: >
        Also used for `PUT` — an update is a full replacement. Unlike SiteVisibility elsewhere,
        sort order is not writable here — a new article is appended to the end of both sites'
        order, and it only ever changes via POST /cms/admin/articles/reorder.
      properties:
        title: { type: string }
        excerpt: { type: string }
        slug: { type: string }
        coverImageKey: { type: string, description: Neon Object Storage object key. }
        contentMarkdown:
          type: string
          description: >
            Raw Markdown. Embed media with a media://articles/... reference (e.g.
            media://articles/images/example.png) instead of a real URL — insert the
            reference after uploading via POST /cms/admin/media/presigned-upload.
        isPublished: { type: boolean, default: false }
        showOnAgency: { type: boolean, default: false }
        featuredOnAgency: { type: boolean, default: false }
        showOnPersonal: { type: boolean, default: false }
        featuredOnPersonal: { type: boolean, default: false }
        tagIds:
          type: array
          items: { type: string, format: uuid }
      required: [title, excerpt]

    CreateServiceRequest:
      allOf:
        - $ref: "#/components/schemas/SiteVisibility"
        - type: object
          description: Also used for `PUT` — an update is a full replacement.
          properties:
            name: { type: string }
            slug: { type: string }
            shortDescription:
              type: string
              description: Markdown — the card blurb.
            eyebrow: { type: string, description: Small badge above the page headline. }
            headline: { type: string, description: The page's H1. Falls back to the name when omitted. }
            deck: { type: string }
            whoThisIsFor: { type: string, description: Markdown bullet list. }
            outcomes: { type: string, description: Markdown bullet list. }
            capabilities: { type: string, description: Markdown bullet list. }
            inDepth: { type: string, description: Markdown. }
            primaryCtaLabel:
              type: string
              description: Set together with primaryCtaUrl, or not at all.
            primaryCtaUrl: { type: string }
            secondaryCtaLabel:
              type: string
              description: Set together with secondaryCtaUrl, or not at all.
            secondaryCtaUrl: { type: string }
            iconObjectKey:
              type: string
              description: Set together with the other icon* fields, or not at all.
            iconUrl: { type: string }
            iconWidth: { type: integer }
            iconHeight: { type: integer }
            iconAltText:
              type: string
              description: Required whenever an icon is set.
            heroImageObjectKey:
              type: string
              description: Set together with the other heroImage* fields, or not at all.
            heroImageUrl: { type: string }
            heroImageWidth: { type: integer }
            heroImageHeight: { type: integer }
            heroImageAltText:
              type: string
              description: Required whenever a hero image is set.
            depthImageObjectKey:
              type: string
              description: Set together with the other depthImage* fields, or not at all. The "in depth" section's image.
            depthImageUrl: { type: string }
            depthImageWidth: { type: integer }
            depthImageHeight: { type: integer }
            depthImageAltText:
              type: string
              description: Required whenever a depth image is set.
            projectIds:
              type: array
              description: The complete set of case studies — replaced wholesale on save, so an omitted id unlinks it.
              items: { type: string, format: uuid }
            seoTitle: { type: string }
            seoDescription: { type: string }
            isPublished: { type: boolean, default: false }
          required: [name, shortDescription]

    CreatePricingPlanRequest:
      type: object
      description: >-
        Also used for `PUT` — an update is a full replacement. Agency-only, so there is no
        site-visibility block. `sortOrder` is absent on purpose — it is never client-settable;
        a new plan is appended to the end of its group's order and only ever changed via the
        drag-and-drop `/reorder` endpoint.
      properties:
        serviceId:
          type: string
          format: uuid
          description: Omit or send null for a combo pack.
        name: { type: string }
        tagline: { type: string }
        priceAmount:
          type: number
          description: Omit for "Custom / Contact us". Do not send 0 to mean that.
        currency: { type: string, examples: [USD] }
        priceType: { $ref: "#/components/schemas/PriceType" }
        deliveryText: { type: string }
        description: { type: string }
        isPopular: { type: boolean, default: false }
        ctaLabel: { type: string }
        ctaUrl: { type: string, format: uri }
        isPublished: { type: boolean, default: false }
        featured: { type: boolean, default: false }
      required: [name, description]

    CreateFaqRequest:
      type: object
      description: Also used for `PUT` — an update is a full replacement. No `sortOrder` here — a new FAQ is appended to the end of its scope's order server-side, and an existing one's position only changes via `POST /cms/admin/faqs/reorder`.
      properties:
        serviceId:
          type: [string, "null"]
          format: uuid
          description: Omit or send null for a general FAQ shared by both sites; otherwise scopes it to that service's page.
        question: { type: string }
        answer: { type: string }
        isPublished: { type: boolean, default: false }
        showOnAgency: { type: boolean, default: false }
        showOnPersonal: { type: boolean, default: false }
      required: [question, answer]

    CreateCertificateRequest:
      type: object
      description: Also used for `PUT` — an update is a full replacement. No `sortOrder` here — a new certificate is appended to the end of the (single, global) order server-side, and an existing one's position only changes via `POST /cms/admin/certificates/reorder`.
      properties:
        name: { type: string }
        issuedBy: { type: string }
        issuedDate: { type: string, format: date }
        marks: { type: string, description: "Free text — a score, grade, or \"Distinction\" style result. Optional." }
        objectKey: { type: string, description: Neon Object Storage object key. }
        url: { type: string }
        mimeType: { type: string, description: "e.g. application/pdf, image/png." }
        width: { type: integer, description: Omit for a PDF, which has no dimensions. }
        height: { type: integer }
        altText: { type: string }
        isPublished: { type: boolean, default: false }
        featured: { type: boolean, default: false }
      required: [name, issuedBy, issuedDate, objectKey, url, mimeType, altText]

    SubmitReviewRequest:
      type: object
      description: What an anonymous visitor submits. Lands unpublished.
      properties:
        name: { type: string }
        country: { type: string }
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2, e.g. `US`.
          examples: ["US"]
        position: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        reviewText: { type: string, maxLength: 2000 }
      required: [name, country, countryCode, rating, reviewText]

    ReviewSubmissionResponse:
      type: object
      description: Deliberately thin — the review is unmoderated, so the submitter gets an id, not the row.
      properties:
        id: { type: string, format: uuid }
      required: [id]

    CreateContactSubmissionRequest:
      type: object
      description: What an anonymous visitor submits through the contact form. `website` is a honeypot — the real form renders it hidden and leaves it empty.
      properties:
        name: { type: string, maxLength: 100 }
        email: { type: string, format: email, maxLength: 255 }
        phone: { type: string, maxLength: 30 }
        company: { type: string, maxLength: 150 }
        subject: { type: string, maxLength: 200 }
        message: { type: string, maxLength: 4000 }
        serviceId:
          type: [string, "null"]
          format: uuid
          description: The service the enquiry is about. Omit or null for a general enquiry.
        budgetRange: { $ref: "#/components/schemas/ContactBudgetRange" }
        site: { $ref: "#/components/schemas/Site" }
        website:
          type: string
          description: Honeypot. Leave empty — a bot that fills it gets filed as spam, silently.
      required: [name, email, message, site]

    ContactSubmissionResponse:
      type: object
      description: Deliberately thin — an acknowledgement, not the row. Echoing the submission would put admin-only fields on the public surface.
      properties:
        id: { type: string, format: uuid }
      required: [id]

    UpdateContactSubmissionRequest:
      type: object
      description: Triage only — status and internal notes. Cannot rewrite what the visitor submitted.
      properties:
        status: { $ref: "#/components/schemas/ContactSubmissionStatus" }
        adminNotes: { type: string, maxLength: 4000 }
      required: [status]

    CreateReviewRequest:
      type: object
      description: "Also used for `PUT` (full replacement). For an admin manually adding a testimonial collected elsewhere — not what the public submission endpoint uses. No `sortOrder` here — a new review is appended to the end of the shared order server-side, and an existing one's position only changes via `POST /cms/admin/reviews/reorder`."
      properties:
        name: { type: string }
        country: { type: string }
        countryCode: { type: string, examples: ["US"] }
        position: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        reviewText: { type: string, maxLength: 2000 }
        isPublished: { type: boolean, default: false }
        isFeatured: { type: boolean, default: false }
      required: [name, country, countryCode, rating, reviewText]

    CreateTagRequest:
      type: object
      description: "Also used for `PUT`. A technology tag requires `technologyCategory`; a category tag must have none."
      properties:
        name: { type: string }
        slug: { type: string }
        isTechnology: { type: boolean, default: false }
        technologyCategory: { $ref: "#/components/schemas/TechCategory" }
      required: [name]

    CreateCurrencyRequest:
      type: object
      description: "Also used for `PUT` (full replacement, and only the override this way — the live rate only ever changes via a refresh). `manualRateFromUsd` (\"price set by me\") is units per 1 USD; omit it to use the live rate instead. USD must always carry exactly 1 and stay active."
      properties:
        code:
          type: string
          description: ISO 4217 — 3 letters, upper-cased by the API.
          minLength: 3
          maxLength: 3
          examples: ["LKR"]
        name: { type: string, maxLength: 100, examples: ["Sri Lankan Rupee"] }
        symbol: { type: string, maxLength: 10, examples: ["Rs"] }
        manualRateFromUsd:
          oneOf: [{ type: number, exclusiveMinimum: 0 }, { type: "null" }]
          examples: [325]
        isActive: { type: boolean, default: false }
      required: [code, name, symbol]

    RefreshCurrencyRatesResponse:
      type: object
      properties:
        updatedCount: { type: integer, examples: [12] }
        fetchedAt: { type: string, format: date-time }
      required: [updatedCount, fetchedAt]

    AddProjectImageRequest:
      type: object
      description: "Also used for `PUT`. Sent after the browser uploads to Neon Object Storage — the API stores `objectKey`, dimensions and alt text, never the bytes."
      properties:
        objectKey: { type: string }
        url: { type: string, format: uri }
        altText:
          type: string
          description: Required on every image. A blank value is rejected.
        width: { type: integer }
        height: { type: integer }
        isPrimary:
          type: boolean
          default: false
          description: Setting this clears the previous primary in the same transaction.
        sortOrder: { type: integer, default: 0 }
      required: [objectKey, url, altText, width, height]

    AddPricingPlanFeatureRequest:
      type: object
      description: Also used for `PUT`.
      properties:
        text: { type: string }
        isIncluded: { type: boolean, default: false }
        sortOrder: { type: integer, default: 0 }
      required: [text]

    PresignedUploadRequest:
      type: object
      properties:
        target: { $ref: "#/components/schemas/MediaTarget" }
        slug:
          type: string
          description: Required when `target` is `projects` or `articles`. Re-slugged server-side, so nothing outside the base folder is reachable.
        objectKey:
          type: string
          description: Overwrite a specific object instead of creating a new one.
      required: [target]

    PresignedUploadResponse:
      type: object
      description: PUT the file straight to `uploadUrl` with a matching content type.
      properties:
        uploadUrl: { type: string, format: uri }
        objectKey: { type: string, examples: ["frostwoodtech/projects/acme-site/hero"] }
        publicUrl:
          type: string
          format: uri
          description: Where the object is readable once the PUT completes — the endpoint and bucket live only in server config, so the caller cannot build this itself.
        expiresAt: { type: string, format: date-time }
      required: [uploadUrl, objectKey, publicUrl, expiresAt]

    MediaConfigResponse:
      type: object
      properties:
        publicBaseUrl:
          type: string
          format: uri
          description: Prefix a `media://` token's key with this (in place of `media://`) to get a loadable url.
      required: [publicBaseUrl]
