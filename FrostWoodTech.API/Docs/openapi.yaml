openapi: 3.1.0

info:
  title: FrostWoodTech CMS API
  version: "1.0.0"
  description: |
    Headless CMS powering three frontends (agency site, personal site, admin SPA) from one
    database. Entities carry per-site visibility flags instead of duplicated rows.

    ## Surfaces

    * `/public/*` — anonymous, read-only, cacheable. Published + non-deleted rows only.
    * `/cms/admin/*` — JWT required, full CRUD, includes drafts and metadata.

    ## Conventions

    * `?site=` is **required** on public endpoints with site visibility — missing it returns
      `400 site_required`.
    * Lists return `{ items, page, pageSize, total }` (`pageSize` defaults to 20, max 100).
    * Errors are RFC 7807 `application/problem+json` — match on `code`, not `detail`.
    * Public GETs are cacheable (`ETag` / `If-None-Match`, 5 min); admin responses are
      `no-store`.
    * Timestamps are UTC `timestamptz`; enums travel as `snake_case` names.

servers:
  - url: http://localhost:7060/api
    description: Local Functions host
  - url: https://<your-function-app>.azurewebsites.net/api
    description: Deployed Function App

tags:
  - name: public
    description: Anonymous, cacheable reads for the two public sites.
  - name: admin
    description: JWT-protected CRUD for the admin SPA.
  - name: auth
    description: Sign-in, token rotation and the account lifecycle.
  - name: ops
    description: Health and diagnostics.

# Everything requires a bearer token unless an operation opts out with `security: []`.
security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [ops]
      operationId: getHealth
      summary: Readiness check
      description: Readiness check that round-trips to Postgres — first request after idle can take ~1s (cold start, not a failure).
      security: []
      responses:
        "200":
          description: The worker can reach the database.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, examples: [healthy] }
                  database: { type: string, examples: [ok] }
        "503":
          description: The database is unreachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, examples: [unhealthy] }
                  database: { type: string, examples: [unreachable] }

  # ----------------------------------------------------------------------------- public
  /public/projects:
    get:
      tags: [public]
      operationId: getPublicProjects
      summary: List published projects for one site
      security: []
      parameters:
        - $ref: "#/components/parameters/SiteRequired"
        - name: tag
          in: query
          description: Slug of a technology tag.
          schema: { type: string }
        - name: category
          in: query
          description: Slug of a category tag (`is_technology = false`).
          schema: { type: string }
        - $ref: "#/components/parameters/Featured"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          $ref: "#/components/responses/PublicProjectList"
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/SiteRequired" }

  /public/projects/{slug}:
    get:
      tags: [public]
      operationId: getPublicProjectBySlug
      summary: One published project
      security: []
      parameters:
        - $ref: "#/components/parameters/SlugPath"
        - $ref: "#/components/parameters/SiteRequired"
      responses:
        "200":
          description: The project, with its tags and images.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/PublicCacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResponse" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/SiteRequired" }
        "404": { $ref: "#/components/responses/NotFound" }

  /public/articles:
    get:
      tags: [public]
      operationId: getPublicArticles
      summary: List published articles for one site
      security: []
      parameters:
        - $ref: "#/components/parameters/SiteRequired"
        - name: tag
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Featured"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          $ref: "#/components/responses/PublicArticleList"
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/SiteRequired" }

  /public/articles/{slug}:
    get:
      tags: [public]
      operationId: getPublicArticleBySlug
      summary: One published article
      security: []
      parameters:
        - $ref: "#/components/parameters/SlugPath"
        - $ref: "#/components/parameters/SiteRequired"
      responses:
        "200":
          description: The article.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/PublicCacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticleResponse" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/SiteRequired" }
        "404": { $ref: "#/components/responses/NotFound" }

  /public/services:
    get:
      tags: [public]
      operationId: getPublicServices
      summary: List published services for one site
      security: []
      parameters:
        - $ref: "#/components/parameters/SiteRequired"
        - $ref: "#/components/parameters/Featured"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          $ref: "#/components/responses/PublicServiceList"
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/SiteRequired" }

  /public/services/{slug}:
    get:
      tags: [public]
      operationId: getPublicServiceBySlug
      summary: One published service
      security: []
      parameters:
        - $ref: "#/components/parameters/SlugPath"
        - $ref: "#/components/parameters/SiteRequired"
      responses:
        "200":
          description: The service.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/PublicCacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceResponse" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/SiteRequired" }
        "404": { $ref: "#/components/responses/NotFound" }

  /public/pricing/combos:
    get:
      tags: [public]
      operationId: getPublicComboPricingPlans
      summary: List combo packs
      description: Plans with no owning service (`service_id is null`) — a separate route so a missing query param can never silently change the filter. Agency-only, so no `site` param.
      security: []
      parameters:
        - $ref: "#/components/parameters/Featured"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          $ref: "#/components/responses/PublicPricingPlanList"
        "304": { $ref: "#/components/responses/NotModified" }

  /public/pricing/services/{serviceId}:
    get:
      tags: [public]
      operationId: getPublicServicePricingPlans
      summary: List one service's pricing tiers
      description: Agency-only, so no `site` param.
      security: []
      parameters:
        - name: serviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          $ref: "#/components/responses/PublicPricingPlanList"
        "304": { $ref: "#/components/responses/NotModified" }

  /public/faqs:
    get:
      tags: [public]
      operationId: getPublicFaqs
      summary: List published FAQs for one site
      description: Returns a bare array — the FAQ list is small enough that paging would only get in the way.
      security: []
      parameters:
        - $ref: "#/components/parameters/SiteRequired"
      responses:
        "200":
          description: The site's FAQs, in sort order.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/PublicCacheControl" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FaqResponse" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/SiteRequired" }

  /public/certificates:
    get:
      tags: [public]
      operationId: getPublicCertificates
      summary: List published certificates
      description: Personal-site only — certificates never appear on the agency site, so there is no `site` param.
      security: []
      parameters:
        - $ref: "#/components/parameters/Featured"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          $ref: "#/components/responses/PublicCertificateList"
        "304": { $ref: "#/components/responses/NotModified" }

  /public/tags:
    get:
      tags: [public]
      operationId: getPublicTags
      summary: List tags
      description: Tags carry no site visibility, so there is no `?site=` here.
      security: []
      parameters:
        - $ref: "#/components/parameters/IsTechnology"
        - $ref: "#/components/parameters/TechnologyCategory"
      responses:
        "200":
          description: The tags, in sort order.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/PublicCacheControl" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TagResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /public/currencies:
    get:
      tags: [public]
      operationId: getPublicCurrencies
      summary: List selectable display currencies
      description: The currencies a visitor may switch to, with the rate to convert at. Active rows only, and no `?site=` — currencies carry no site visibility. Rates are typed by an admin and change only when they do, deliberately not tracking the live market.
      security: []
      responses:
        "200":
          description: The active currencies, ordered by code.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/PublicCacheControl" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CurrencyResponse" }
        "304": { $ref: "#/components/responses/NotModified" }

  /public/home:
    get:
      tags: [public]
      operationId: getPublicHome
      summary: Everything one home page needs
      description: One round trip instead of six — the featured slices for that site, plus its FAQs.
      security: []
      parameters:
        - $ref: "#/components/parameters/SiteRequired"
      responses:
        "200":
          description: The home page payload.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/PublicCacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeResponse" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/SiteRequired" }

  /public/reviews:
    get:
      tags: [public]
      operationId: getPublicReviews
      summary: Paged, published reviews
      description: Not site-scoped — reviews are shared across both public sites.
      security: []
      parameters:
        - $ref: "#/components/parameters/ReviewSort"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of published reviews.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/PublicCacheControl" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paged"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/ReviewResponse" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [public]
      operationId: submitReview
      summary: Submit a review
      description: One of two anonymous public writes in the API (see also `POST /public/contact`) — lands unpublished until an admin approves it. Rate limited per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitReviewRequest" }
      responses:
        "201":
          description: Acknowledgement only — the row is unmoderated, so the full review is not returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewSubmissionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: Too many submissions from this address. See `code`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /public/contact:
    post:
      tags: [public]
      operationId: submitContactSubmission
      summary: Submit a contact form enquiry
      description: Anonymous public write. Never public content — there is no matching public read; it only ever surfaces in the admin inbox. Rate limited per IP; a filled `website` honeypot field is filed as spam but still answered normally.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateContactSubmissionRequest" }
      responses:
        "201":
          description: Acknowledgement only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactSubmissionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: Too many submissions from this address. See `code`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  # ------------------------------------------------------------------------------- auth
  /cms/admin/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Request an admin account
      description: Creates an `email_verification_required` account and emails a verification link. No token returned — verification then super admin approval are both required before sign-in works.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: The newly created account, awaiting email verification.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /cms/admin/auth/verify-email:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Confirm a registered email address
      description: Moves a password account from `email_verification_required` to `pending`, using the token from the emailed link. Never issues a sign-in token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyEmailRequest" }
      responses:
        "200":
          description: The account, now `pending` approval.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: No token matches (`invalid_verification_token`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Already used (`verification_token_already_used`) or expired (`verification_token_expired`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /cms/admin/auth/forgot-password:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Request a password reset link
      description: Emails a 1h single-use reset link, invalidating any prior one. Always the same generic 200 — cannot be used to enumerate accounts. Rate limited to 3 per email and 3 per IP per 15 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotPasswordRequest" }
      responses:
        "200":
          description: The same generic acknowledgement in every case.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForgotPasswordResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /cms/admin/auth/set-password:
    post:
      tags: [auth]
      operationId: setPassword
      summary: Set a password from an emailed link
      description: Redeems a single-use password link (setup or reset, consumed identically). Invalidates any other outstanding link for the user and revokes every refresh token. Never issues a sign-in token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetPasswordRequest" }
      responses:
        "200":
          description: The account, which can now sign in with the new password.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: No token matches (`invalid_setup_token`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Already used (`setup_token_already_used`) or expired (`setup_token_expired`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /cms/admin/auth/resend-verification:
    post:
      tags: [auth]
      operationId: resendVerification
      summary: Resend the verification email
      description: Always returns the same generic success regardless of `email` — prevents using this endpoint to enumerate accounts.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResendVerificationRequest" }
      responses:
        "202":
          description: Generic acknowledgement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResendVerificationResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /cms/admin/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Email + password sign-in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/Auth" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Bad credentials, or the account is unverified, pending, rejected, or disabled — see `code`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /cms/admin/auth/google:
    post:
      tags: [auth]
      operationId: googleSignIn
      summary: Exchange a Google ID token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoogleSignInRequest" }
      responses:
        "200": { $ref: "#/components/responses/Auth" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /cms/admin/auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Rotate a refresh token
      description: >-
        The old token is revoked as the new pair is issued — refresh tokens are single-use. The
        refresh token travels as an httpOnly `refreshToken` cookie (set by login/google/refresh
        itself), never in the request or response body — callers must send the request with
        credentials included.
      security: []
      responses:
        "200": { $ref: "#/components/responses/Auth" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /cms/admin/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke one refresh token
      description: >-
        Reads the `refreshToken` cookie to identify which token to revoke and clears it
        regardless of outcome — send the request with credentials included.
      security: []
      responses:
        "204": { $ref: "#/components/responses/NoContent" }

  /cms/admin/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The signed-in account
      responses:
        "200":
          description: The caller's own user record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /cms/admin/auth/change-password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change your own password
      description: Verifies the current password and revokes every refresh token on success.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ------------------------------------------------------------------------------ users
  /cms/admin/users:
    get:
      tags: [admin]
      operationId: getUsers
      summary: List admin accounts
      description: Super admin only.
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/UserStatus" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of accounts.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paged"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/AdminUserResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /cms/admin/users/{id}:
    delete:
      tags: [admin]
      operationId: deleteUser
      summary: Soft-delete an account
      description: Super admin only.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /cms/admin/users/{id}/approve:
    post:
      tags: [admin]
      operationId: approveUser
      summary: Approve a pending account
      description: Super admin only. The account can sign in from this point.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /cms/admin/users/{id}/reject:
    post:
      tags: [admin]
      operationId: rejectUser
      summary: Reject a pending account
      description: Super admin only. The reason is stored on the row.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RejectUserRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /cms/admin/users/{id}/disable:
    post:
      tags: [admin]
      operationId: disableUser
      summary: Disable an approved account
      description: Super admin only.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --------------------------------------------------------------------------- projects
  /cms/admin/projects:
    get:
      tags: [admin]
      operationId: getAdminProjects
      summary: List projects, drafts included
      parameters:
        - $ref: "#/components/parameters/SiteRequired"
        - $ref: "#/components/parameters/IsPublished"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/IncludeHidden"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of projects.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paged"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/AdminProjectResponse" }
        "400": { $ref: "#/components/responses/SiteRequired" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [admin]
      operationId: createProject
